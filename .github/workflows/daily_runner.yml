name: Run Daily Football AI Analysis

on:
  schedule:
    - cron: '0 1 * * *' # รันทุกวัน เวลา 08:00 น. (เวลาไทย)
  workflow_dispatch: # ปุ่มสำหรับกดรันเองยามต้องการ

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI Football Analyzer
        env:
          FOOTBALL_API_TOKEN: ${{ secrets.FOOTBALL_API_TOKEN }}
        run: python main.py
